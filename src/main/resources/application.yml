spring:
  application:
    name: final_year_project
  # 激活 dev 配置；MySQL 密码：设置环境变量 MYSQL_PASSWORD，或创建 application-local.yml 覆盖
  profiles:
    active: dev,local

  # 数据源配置（可通过环境变量 MYSQL_USERNAME、MYSQL_PASSWORD 覆盖，或使用 application-local.yml）
  datasource:
    url: jdbc:mysql://localhost:3306/note_recommend_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 20000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # Redis 配置：缓存与计数
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# 服务端口
server:
  port: 8080

# JWT
jwt:
  secret: note-recommend-system-secret-key-change-in-production-min-256bits
  expiration-ms: 604800000
  header: Authorization
  prefix: Bearer 

# 管理员注册：注册时请求体携带 adminSecret 且与下方一致则创建为 ADMIN（不传或错误则为普通用户）
app:
  admin-register-secret: change-this-admin-secret-in-production
